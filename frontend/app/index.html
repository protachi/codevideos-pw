<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- import Inter e Roboto fonts-->
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <!-- Import de Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=check_circle" />
  <link rel="stylesheet" href="./styles.css">
  <title>Codevideos</title>
</head>
<body>
  <header id="main-header">
    <nav>
      <ul>
        <li><a href="/" data-page>Home</a></li>
        <li><a href="/sobre" data-page>Sobre</a></li>
        <li><a href="/contato" data-page>Contato</a></li>
      </ul>
    </nav>
  </header>

  <main id="app-page">
      <!-- O conteúdo da página vai entrar aqui via JS -->
  </main>

  <!-- <footer id="main-footer"></footer> -->
<footer>
        © 2026 CodeVideos — Sua jornada de aprendizado começa aqui.
      </footer>
  <!-- type: module permite o uso de 'import' e 'export' mas obriga usar um liveserver para a aplicação devido ao CORS -->
  <!-- defer faz com que o JS seja carregado em paralelo, mas só executado quando a árvore DOM for totalmente carregada -->
  <script type="module" src="./app.js" defer></script>
</body>
</html>
