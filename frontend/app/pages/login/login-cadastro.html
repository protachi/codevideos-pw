<div id="page-login" class="container">
  
  <div class="form-box login">
    <form action="">
      <h1>Login</h1>
      <div class="input-box">
        <input type="text" placeholder="Usuário, CPF ou E-mail" required />
        <i class="bx bxs-user"></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Senha" required />
        <i class="bx bx-lock-alt"></i>
      </div>

      <button type="submit" class="btn solid secondary">Login</button>

    </form>
  </div>
  
  <div class="form-box cadastro">
    <form action="" autocomplete="off">
      <h1>Cadastro</h1>
      <div class="input-box">
        <input type="text" placeholder="Usuário" required />
        <i class="bx bxs-user"></i>
      </div>
      <div class="input-box">
        <input type="email" placeholder="E-mail" required autocomplete="unknown" />
        <i class="bx bxs-envelope"></i>
      </div>

      <div class="input-box">
        <input type="text" id="cpf" name="cpf" pattern="\d{11}" placeholder="CPF" maxlength="11" required />
        <i class="bx bxs-user"></i>
      </div>

      <div class="input-box">
        <input type="telephone" id="telefone" name="telefone" placeholder="Telefone" maxlength="9" required />
        <i class="bx bxs-phone"></i>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Senha" required autocomplete="new-password"/>
        <i class="bx bx-lock-alt"></i>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Confirme a senha" required autocomplete="new-password" />
        <i class="bx bx-check"></i>
      </div>

      <button type="submit" class="btn solid secondary">Cadastre-se</button>

    </form>
  </div>

  <div class="toggle-box">
    <div class="toggle-panel toggle-left">
      <img src="./img/kibonso.png" alt="logo" class="logo" />
      <h1>Bem-Vindo a CodeVideos!</h1>
      <br>
      <p>Não possui uma conta?</p>
      <button class="btn solid primary cadastro-btn">Cadastre-se</button>
    </div>

    <div class="toggle-panel toggle-right">
      <img src="./img/kibonso.png" alt="logo" class="logo" />
      <h1>Bem-Vindo, de volta!</h1>
      <br>
      <p>Já possui uma conta?</p>
      <button class="btn solid primary login-btn">Login</button>
    </div>
  </div>
</div>
