<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="./page-user.css" />
  </head>
  <body>
    <h1>Meu Perfil</h1>

    <section id="perfil">
      <img src="foto.png" alt="Foto do Usuario" />

      <div>
        <span id="username">Nome do Usuario</span>
        <button type="button" id="edt-username">editar</button>
      </div>

      <p>allan.jack@email.com</p>
    </section>
    <button type="button" id="btn-confirmar-senha">Alterar Senha</button>
    <section id="senha" hidden>
      <form id="form-senha">
        <label for="senha-atual">Senha Atual</label>
        <input type="password" id="senha-atual" />

        <label for="senha-nova">Senha Nova</label>
        <input type="password" id="senha-nova" />

        <label for="confirmar-senha">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" />

        <button type="submit" id="btn-confirmar-senha">Confirmar</button>
      </form>
    </section>

    <section id="progresso">
      <h2>Meu Progresso</h2>

      <button type="button" id="btn-meus-cursos">
        <span>Meu curso</span>
      </button>

      <progress id="barra-progresso" value="50" max="100">50%</progress>
      <span id="porcentagem">50%</span>

      <p>Features desenvolvidas: <span id="features">5/10</span></p>
    </section>

    <script src="page-user.js"></script>
  </body>
</html>
