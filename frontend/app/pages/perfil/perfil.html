<div id="page-perfil">

  <h1>Meu Perfil</h1>

  <section id="perfil" class="card">
    <img
      src="https://images.unsplash.com/vector-1742875355318-00d715aec3e8?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      alt="Foto do Usuario" />

    <div class="username-line">
      <span id="username">Nome do Usuario</span>
      <button type="button" id="edt-username" class="btn solid primary">editar</button>
    </div>

    <p>allan.jack@email.com</p>

    <button type="button" id="btn-alterar-senha" class="btn solid secondary">Alterar Senha</button>

    <section id="senha" hidden class="card">
      <form id="form-senha">
        <label for="senha-atual">Senha Atual</label>
        <input type="password" id="senha-atual" />

        <label for="senha-nova">Senha Nova</label>
        <input type="password" id="senha-nova" />

        <label for="confirmar-senha">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" />

        <button type="submit" id="btn-confirmar-senha" class="btn solid secondary">Confirmar</button>
      </form>
    </section>
  </section>



  <section id="progresso" class="card">
    <h2>Meu Progresso</h2>

    <div class="card-content">
      <button type="button" id="btn-meus-cursos" class="btn solid primary">
        <span>Meu curso</span>
      </button>

      <progress id="barra-progresso" value="50" max="100">50%</progress>
      <span id="porcentagem">50%</span>

      <p>Features desenvolvidas: <span id="features">5/10</span></p>
    </div>

  </section>

</div>
